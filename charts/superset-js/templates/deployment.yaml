apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "superset-js.fullname" . }}
  labels:
    {{- include "superset-js.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "superset-js.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "superset-js.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DB_PATH
              value: "{{ .Values.persistence.mountPath }}/superset.db"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: GITHUB_TOKEN
            - name: ENABLE_INGESTION
              value: "{{ .Values.enable.ingestion }}"
            - name: ENABLE_NORMALIZATION_OXLINT_RAW
              value: "{{ .Values.enable.normalization.oxlintRaw }}"
            - name: ENABLE_NORMALIZATION_OXLINT_JS_DEPS
              value: "{{ .Values.enable.normalization.oxlintJsDeps }}"
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

        {{- if .Values.litestream.enabled }}
        - name: litestream
          image: "{{ .Values.litestream.image.repository }}:{{ .Values.litestream.image.tag }}"
          imagePullPolicy: {{ .Values.litestream.image.pullPolicy }}
          env:
            - name: LITESTREAM_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: MINIO_ACCESS_KEY
            - name: LITESTREAM_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: MINIO_SECRET_KEY
          args:
            - replicate
            - /data/superset.db
            - s3://{{ .Values.litestream.bucket }}/{{ .Values.litestream.dbPath }}
          volumeMounts:
            - name: data
              mountPath: /data
        {{- end }}

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "superset-js.fullname" . }}