replicaCount: 1

image:
  repository: ghcr.io/gildedpleb/superset-js
  pullPolicy: Always
  tag: "latest"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

persistence:
  enabled: true
  storageClassName: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  mountPath: /data

enable:
  ingestion: true
  normalization:
    oxlintRaw: false
    oxlintJsDeps: false

litestream:
  enabled: true
  image:
    repository: litestream/litestream
    tag: "latest"
    pullPolicy: IfNotPresent
  endpoint: http://minio.minio.svc.cluster.local:9000
  bucket: superset-js
  dbPath: superset.db

secretName: superset-js-secrets